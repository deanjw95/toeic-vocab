name: Deploy Supabase (sync + Telegram)

# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   TELEGRAM_BOT_TOKEN     from @BotFather (optional; without it only sync is deployed)
#   AZURE_SPEECH_KEY       Azure Speech resource → Keys and Endpoint → KEY 1 (optional; neural voices)
#   AZURE_SPEECH_REGION    the same page's Location/Region, e.g. koreacentral

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  PROJECT_REF: qosmmsyxmucjrsnugful
  SUPABASE: npx -y supabase@3.3.0
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
  AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::저장소 Secrets에 SUPABASE_ACCESS_TOKEN 이 없어요"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::저장소 Secrets에 SUPABASE_DB_PASSWORD 가 없어요"; missing=1; }
          [ -n "$TELEGRAM_BOT_TOKEN" ] || echo "::warning::TELEGRAM_BOT_TOKEN 이 없어서 텔레그램 설정은 건너뛰어요"
          [ -n "$AZURE_SPEECH_KEY" ] && [ -n "$AZURE_SPEECH_REGION" ] || echo "::warning::AZURE_SPEECH_KEY/AZURE_SPEECH_REGION 이 없어서 Azure 음성은 꺼져 있어요"
          exit $missing

      - name: Database migrations
        run: $SUPABASE db push --remote=$PROJECT_REF -p "$SUPABASE_DB_PASSWORD" --yes

      - name: Telegram token format
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          # prints only the shape, never the token
          t="$TELEGRAM_BOT_TOKEN"
          echo "length=${#t} fingerprint=$(printf %s "$t" | sha256sum | cut -c1-8)"
          [[ "$t" =~ ^[0-9]{6,12}:[A-Za-z0-9_-]{30,}$ ]] && echo "format ok" || echo "::warning::토큰 형식이 이상해요 (앞뒤 공백, 따옴표, 'bot' 접두어 등이 있는지 확인)"
          r=$(curl -sS -m 60 "https://api.telegram.org/bot$t/getMe"); echo "$r" | jq '{ok, error_code, description, username: .result.username}'

      - name: Telegram secrets
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          WH=$(printf %s "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          echo "::add-mask::$WH"
          $SUPABASE secrets set --remote=$PROJECT_REF --yes TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" TELEGRAM_WEBHOOK_SECRET="$WH"

      - name: Azure speech secrets
        if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        run: |
          REGION=$(printf %s "$AZURE_SPEECH_REGION" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          KEY=$(printf %s "$AZURE_SPEECH_KEY" | tr -d '[:space:]')
          echo "region=$REGION key length=${#KEY}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://$REGION.api.cognitive.microsoft.com/sts/v1.0/issueToken" -H "Ocp-Apim-Subscription-Key: $KEY" -H 'Content-Length: 0')
          echo "azure key check: $code"; [ "$code" = 200 ] || echo "::warning::Azure 키 확인 실패 ($code). 키와 지역이 맞는지 확인해 주세요"
          $SUPABASE secrets set --remote=$PROJECT_REF --yes AZURE_SPEECH_KEY="$KEY" AZURE_SPEECH_REGION="$REGION"

      - name: Edge functions
        run: $SUPABASE functions deploy --remote=$PROJECT_REF --use-api --yes

      # Best effort: GitHub's shared IPs are often rate-limited by Telegram.
      # The sync function also registers the webhook when "텔레그램 연결" is pressed.
      - name: Telegram webhook
        if: env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        run: |
          WH=$(printf %s "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          API="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          tg() { # retries when Telegram says "Too Many Requests"
            for i in 1 2; do
              r=$(curl -sS "$@"); echo "$r" | jq '{ok, description}'
              [ "$(echo "$r" | jq -r .ok)" = true ] && return 0
              sleep $(( $(echo "$r" | jq -r '.parameters.retry_after // 5') + 1 ))
            done
            return 1
          }
          tg "$API/setWebhook" \
            --data-urlencode "url=https://$PROJECT_REF.supabase.co/functions/v1/telegram" \
            --data-urlencode "secret_token=$WH" \
            --data-urlencode 'allowed_updates=["message","callback_query"]'
          tg "$API/setMyCommands" -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"quiz","description":"복습 퀴즈 5문제"},{"command":"today","description":"오늘 복습 현황"}]}'
          curl -sS "$API/getWebhookInfo" | jq '.result | {url, pending_update_count, last_error_message}'

      - name: Smoke test
        run: |
          F="https://$PROJECT_REF.supabase.co/functions/v1"
          r=$(curl -sS -w ' %{http_code}' -X POST "$F/sync" -H 'Content-Type: application/json' -d '{"action":"sync","key":"smoke-test-key-not-a-space"}')
          echo "sync: $r"; echo "$r" | grep -q ' 404$'
          r=$(curl -sS -X POST "$F/notify" -H 'Content-Type: application/json' -d '{"slot":"nope"}')
          echo "notify: $r"; [ "$r" = "unknown slot" ]
          r=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$F/telegram" -d '{}')
          echo "telegram without secret: $r"; [ "$r" = 403 ]
          r=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$F/tts" -H 'Content-Type: application/json' -d '{"text":"hello","accent":"us"}')
          echo "tts without key: $r"; [ "$r" = 403 ]
